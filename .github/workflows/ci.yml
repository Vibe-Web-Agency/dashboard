name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  schema:
    name: Tests du schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rejoue les scénarios de sécurité et d'intégrité du schéma v2 dans un
      # Postgres en mémoire (PGlite). Ne touche à aucune base Supabase.
      - run: npm run db:check

      # Vérifie que la base se construit depuis zéro avec les migrations
      # (et pas seulement depuis le document de conception).
      - run: npm run db:dryrun

  lint:
    name: Lint (informatif)
    runs-on: ubuntu-latest
    # NON BLOQUANT pour l'instant : le code actuel compte 125 erreurs
    # préexistantes (95 « any »). Une CI rouge en permanence ne sert à rien.
    # À repasser en bloquant quand la reconstruction v2 aura remplacé ces pages.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
