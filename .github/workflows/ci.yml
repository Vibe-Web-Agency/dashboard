name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  schema:
    name: Tests du schéma
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Rejoue les scénarios de sécurité et d'intégrité du schéma v2 dans un
      # Postgres en mémoire (PGlite). Ne touche à aucune base Supabase.
      - run: npm run db:check

      # Vérifie que la base se construit depuis zéro avec les migrations
      # (et pas seulement depuis le document de conception).
      - run: npm run db:dryrun

  lint:
    name: Lint (informatif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le code actuel compte 125 erreurs préexistantes (95 « any »). On les
      # compte et on les affiche en AVERTISSEMENT, sans faire échouer la PR :
      # une croix rouge permanente, on apprend à l'ignorer, et on finit par
      # rater les vraies régressions.
      # À repasser en bloquant quand la reconstruction v2 aura remplacé ces pages.
      - name: Lint
        run: |
          npm run lint 2>&1 | tee /tmp/lint.txt || true
          n=$(grep -cE "^\s+[0-9]+:[0-9]+\s+error" /tmp/lint.txt || true)
          echo "::warning::${n} erreurs de lint (code hérité, non bloquant)"
          echo "### Lint : ${n} erreurs (non bloquant)" >> "$GITHUB_STEP_SUMMARY"
